<svg xmlns="http://www.w3.org/2000/svg" width="420" height="130" viewBox="0 0 420 130" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>
    <linearGradient id="progress-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#1ed760" />
    </linearGradient>
    <linearGradient id="cover-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <clipPath id="cover-clip">
      <rect x="18" y="18" width="94" height="94" rx="10" />
    </clipPath>
  </defs>

  <style>
    .bold { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
    .medium { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .regular { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    
    @keyframes bounce1 {
      0%, 100% { height: 4px; y: 35px; }
      50% { height: 16px; y: 23px; }
    }
    @keyframes bounce2 {
      0%, 100% { height: 14px; y: 25px; }
      50% { height: 6px; y: 33px; }
    }
    @keyframes bounce3 {
      0%, 100% { height: 8px; y: 31px; }
      50% { height: 18px; y: 21px; }
    }
    @keyframes bounce4 {
      0%, 100% { height: 16px; y: 23px; }
      50% { height: 5px; y: 34px; }
    }
    .bar1 { animation: bounce1 1.2s ease-in-out infinite; }
    .bar2 { animation: bounce2 1.0s ease-in-out infinite 0.2s; }
    .bar3 { animation: bounce3 1.3s ease-in-out infinite 0.4s; }
    .bar4 { animation: bounce4 0.9s ease-in-out infinite 0.1s; }
  </style>

  <!-- Container Box -->
  <rect width="420" height="130" rx="14" fill="url(#bg-grad)" stroke="#292e42" stroke-width="1.5" />

  <!-- Album Cover Artwork -->
  <g clip-path="url(#cover-clip)">
    <rect x="18" y="18" width="94" height="94" fill="url(#cover-grad)" />
    <!-- AW (Alan Walker) Stylized Logo Motif -->
    <path d="M45 80 L65 38 L85 80 L75 80 L65 58 L55 80 Z" fill="#ffffff" opacity="0.9" />
    <path d="M52 68 L78 68" stroke="#1DB954" stroke-width="3" stroke-linecap="round" />
    <!-- Disc glow circle -->
    <circle cx="65" cy="65" r="40" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" />
    <circle cx="65" cy="65" r="28" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Header / Badge -->
  <text x="128" y="34" class="bold" font-size="10" fill="#1DB954" letter-spacing="1.5">ON REPEAT</text>

  <!-- Track Title & Artist -->
  <text x="128" y="54" class="bold" font-size="16" fill="#c0caf5">Faded</text>
  <text x="128" y="71" class="medium" font-size="13" fill="#7aa2f7">Alan Walker</text>

  <!-- Animated Sound Equalizer -->
  <g transform="translate(365, 5)">
    <rect class="bar1" x="0" y="27" width="3" height="12" rx="1.5" fill="#1DB954" />
    <rect class="bar2" x="6" y="25" width="3" height="14" rx="1.5" fill="#1DB954" />
    <rect class="bar3" x="12" y="29" width="3" height="10" rx="1.5" fill="#1DB954" />
    <rect class="bar4" x="18" y="24" width="3" height="15" rx="1.5" fill="#1DB954" />
  </g>

  <!-- Progress Bar & Controls -->
  <!-- Track line background -->
  <rect x="128" y="86" width="235" height="4" rx="2" fill="#292e42" />
  <!-- Progress fill -->
  <rect x="128" y="86" width="95" height="4" rx="2" fill="url(#progress-grad)" />
  <!-- Thumb circle -->
  <circle cx="223" cy="88" r="4" fill="#ffffff" />

  <!-- Timestamps -->
  <text x="128" y="103" class="regular" font-size="10" fill="#565f89">01:24</text>
  <text x="340" y="103" class="regular" font-size="10" fill="#565f89">03:32</text>

  <!-- Spotify Icon in Corner -->
  <g transform="translate(382, 92) scale(0.7)">
    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.502 17.308c-.216.353-.674.466-1.027.25-2.812-1.717-6.351-2.106-10.52-1.152-.403.092-.806-.157-.898-.56-.092-.403.157-.806.56-.898 4.567-1.043 8.473-.598 11.635 1.333.353.216.466.674.25 1.027zm1.468-3.262c-.272.443-.852.583-1.295.311-3.22-1.979-8.128-2.551-11.936-1.395-.498.151-1.03-.133-1.181-.631-.151-.498.133-1.03.631-1.181 4.356-1.321 9.775-.681 13.47 1.59.443.272.583.852.311 1.306zm.126-3.397c-3.86-2.292-10.224-2.503-13.887-1.391-.592.18-1.222-.154-1.402-.746-.18-.592.154-1.222.746-1.402 4.218-1.28 11.238-1.034 15.688 1.608.532.315.706 1.002.391 1.534-.315.532-1.002.706-1.536.397z" fill="#1DB954"/>
  </g>
</svg>
